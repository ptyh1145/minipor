name: build

# 在自托管 runner（自己的电脑）上构建。
# 输入文件留在本机磁盘，工作流只读取路径；产物写回本机目录，不上传任何输入。

on:
  workflow_dispatch:
    inputs:
      base:
        description: "本机路径：基础包（zip/pkg）"
        required: false
        default: "H:\\inputs\\base.pkg"
      assets:
        description: "本机路径：来源资源目录（含 assets/）"
        required: false
        default: "H:\\inputs\\assets"
      out_dir:
        description: "本机输出目录"
        required: false
        default: "H:\\output"
      overlay:
        description: "附加：none | sound | tex"
        required: false
        default: "none"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/build.yml"

env:
  # push 触发时 inputs 为空，这里给出默认值
  MW_BASE: ${{ inputs.base || 'H:\inputs\base.pkg' }}
  MW_ASSETS: ${{ inputs.assets || 'H:\inputs\assets' }}
  MW_OUT: ${{ inputs.out_dir || 'H:\output' }}
  MW_OVERLAY: ${{ inputs.overlay || 'none' }}

jobs:
  build:
    # 需要先在这台机器上注册 runner，标签保持默认（self-hosted / Windows / X64）
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs exist locally
        shell: powershell
        run: |
          Write-Host "base    : $env:MW_BASE"
          Write-Host "assets  : $env:MW_ASSETS"
          Write-Host "out     : $env:MW_OUT"
          Write-Host "overlay : $env:MW_OVERLAY"
          if (-not (Test-Path $env:MW_BASE))   { throw "base package not found: $env:MW_BASE" }
          if (-not (Test-Path $env:MW_ASSETS)) { throw "asset tree not found: $env:MW_ASSETS" }
          "asset files: " + (Get-ChildItem -Recurse -File $env:MW_ASSETS | Measure-Object).Count

      - name: Build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:MW_OUT -Force | Out-Null
          $target = Join-Path $env:MW_OUT "output.pkg"
          switch ($env:MW_OVERLAY) {
            "sound" {
              python tools/table_merge.py $env:MW_BASE $env:MW_ASSETS $target --overlay-art --art-ext ogg
            }
            "tex" {
              python tools/table_merge.py $env:MW_BASE $env:MW_ASSETS $target --overlay-art
            }
            default {
              python tools/build_package.py --base $env:MW_BASE --assets $env:MW_ASSETS --out $target
            }
          }
          if (-not (Test-Path $target)) { throw "build produced nothing" }
          Write-Host ("done: {0} ({1:N1} MB)" -f $target, ((Get-Item $target).Length / 1MB))

      - name: Trim old builds (keep last 2)
        shell: powershell
        run: |
          Get-ChildItem $env:MW_OUT -Filter "*.pkg" | Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 2 | Remove-Item -Force -ErrorAction SilentlyContinue

      # 不上传产物：输出留在本机 out_dir，避免把受版权保护的内容传到任何服务器
