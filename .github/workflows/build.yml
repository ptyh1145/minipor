name: build

# 在自托管 runner（自己的电脑）上构建成品包。
# 输入文件留在本机磁盘，工作流只读取路径；产物写回本机目录，不上传任何输入。
#
# mode:
#   merge   —— 只合并数据表（最小改动）
#   assets  —— 合并 + 覆盖资源（贴图/音效/模型）
#   oldonly —— assets + 删除目标端独有的行并清理引用

on:
  workflow_dispatch:
    inputs:
      base:
        description: "本机路径：基础包（zip/pkg）"
        required: false
        default: "H:\\inputs\\base.pkg"
      assets:
        description: "本机路径：源资源目录（含 assets/）"
        required: false
        default: "H:\\inputs\\assets_clean"
      source_pkg:
        description: "本机路径：源 APK（oldonly/assets 模式用）"
        required: false
        default: "H:\\inputs\\source.apk"
      out_dir:
        description: "本机输出目录"
        required: false
        default: "H:\\output"
      mode:
        description: "merge | assets | oldonly"
        required: false
        default: "oldonly"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/build.yml"

env:
  MW_BASE: ${{ inputs.base || 'H:\inputs\base.pkg' }}
  MW_ASSETS: ${{ inputs.assets || 'H:\inputs\assets_clean' }}
  MW_SOURCE: ${{ inputs.source_pkg || 'H:\inputs\source.apk' }}
  MW_OUT: ${{ inputs.out_dir || 'H:\output' }}
  MW_MODE: ${{ inputs.mode || 'oldonly' }}

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Show inputs
        shell: powershell
        run: |
          Write-Host "base    : $env:MW_BASE"
          Write-Host "assets  : $env:MW_ASSETS"
          Write-Host "source  : $env:MW_SOURCE"
          Write-Host "out     : $env:MW_OUT"
          Write-Host "mode    : $env:MW_MODE"
          foreach ($p in @($env:MW_BASE, $env:MW_ASSETS, $env:MW_SOURCE)) {
            Write-Host ("  {0} exists={1}" -f $p, (Test-Path $p))
          }

      - name: Build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:MW_OUT -Force | Out-Null
          $target = Join-Path $env:MW_OUT "output.pkg"
          switch ($env:MW_MODE) {
            "merge" {
              python tools/build_package.py --base $env:MW_BASE --assets $env:MW_ASSETS --out $target
            }
            "assets" {
              python tools/table_merge.py $env:MW_BASE $env:MW_ASSETS $target --overlay-art
            }
            default {
              python tools/build_bundle.py $env:MW_BASE $env:MW_SOURCE $target
            }
          }
          if (-not (Test-Path $target)) { throw "build produced nothing" }
          Write-Host ("done: {0} ({1:N1} MB)" -f $target, ((Get-Item $target).Length / 1MB))

      - name: Trim old builds (keep last 2)
        shell: powershell
        run: |
          Get-ChildItem $env:MW_OUT -Filter "*.pkg" | Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 2 | Remove-Item -Force -ErrorAction SilentlyContinue
