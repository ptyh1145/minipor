name: native

# 编译 C++ 预览渲染器与地形核心校验工具（无第三方依赖）。
# 资源在运行时由本地提供，构建过程不接触任何游戏文件。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "ios/core/**"
      - ".github/workflows/native.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build-native -A x64

      - name: Build
        run: cmake --build build-native --config Release

      - name: Check outputs
        shell: powershell
        run: |
          $exes = Get-ChildItem -Recurse build-native -Filter *.exe
          if (-not $exes) { throw "no executable produced" }
          foreach ($e in $exes) { Write-Host ("{0}: {1:N0} KB" -f $e.Name, ($e.Length / 1KB)) }
          foreach ($want in @("preview.exe", "terrain_check.exe")) {
            if (-not ($exes | Where-Object { $_.Name -eq $want })) { throw "$want missing" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-tools
          path: |
            build-native/**/preview.exe
            build-native/**/terrain_check.exe
          if-no-files-found: error
