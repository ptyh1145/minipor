name: native

# 编译 C++ 预览渲染器与地形核心校验工具（无第三方依赖）。
# 资源在运行时由本地提供，构建过程不接触任何游戏文件。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "ios/core/**"
      - ".github/workflows/native.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build-native -A x64

      - name: Build
        run: cmake --build build-native --config Release

